name: 🗞️ AI 日报自动生成

on:
  # 每天北京时间早上 8 点 (UTC 00:00) 自动运行
  schedule:
    - cron: '0 0 * * *'

  # 支持手动触发
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新生成（即使当天日报已存在）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout 仓库
        uses: actions/checkout@v4

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔄 如果强制模式，删除已有日报
        if: github.event.inputs.force == 'true'
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          FILE="issues/${DATE}.html"
          if [ -f "$FILE" ]; then
            echo "🗑️ 强制模式：删除 $FILE"
            rm "$FILE"
          fi

      - name: 🗞️ 生成日报
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'anthropic' }}
        run: node scripts/generate-daily.mjs

      - name: 📤 提交变更
        id: commit
        run: |
          git config user.name "AI Daily Bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"

          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)

          git add -A
          if git diff --staged --quiet; then
            echo "✅ 没有变更需要提交（日报可能已存在）"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "📰 AI 日报 ${DATE} - 自动生成"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ 已推送到 GitHub"
          fi

      # 直接在本 workflow 中部署 Pages（避免 GITHUB_TOKEN push 不触发其他 workflow 的问题）
      - name: 📦 上传 Pages Artifact
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    runs-on: ubuntu-latest
    needs: generate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 生成失败时发 Issue 通知
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: generate
    if: failure()
    steps:
      - name: 🚨 创建失败通知 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 AI 日报生成失败 - ${date}`,
              body: `## 自动生成失败\n\n- **日期**: ${date}\n- **运行 ID**: ${context.runId}\n- **详情**: [查看 Actions 日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n请检查 API Key 是否有效、Tavily/LLM 服务是否正常。`,
              labels: ['bug', 'auto-generated']
            });
